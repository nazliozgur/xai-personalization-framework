# E-commerce Domain Configuration
domain:
  name: e_commerce
  description: "E-commerce product recommendations and rating prediction"

schema:
  user_id:
    - user_id
    - reviewerID
    - customer_id
  item_id:
    - parent_asin
    - asin
    - product_id
  target:
    - rating
    - score
  timestamp:
    - timestamp
    - unixReviewTime
  verification:
    - verified_purchase
    - is_verified
  engagement:
    - helpful_vote
    - helpfulness
  text:
    - review_text
    - text

target:
  type: rating
  range: [1, 5]
  distribution: left_skewed

features:
  temporal:
    - days_since_last_purchase
    - account_age_days
    - purchase_frequency
  text:
    - review_length
    - sentiment_score
    - tfidf_features
  user:
    - user_total_reviews
    - user_avg_rating
    - user_consistency
  item:
    - item_avg_rating
    - item_review_count
    - item_popularity

business_kpis:
  - Revenue Impact
  - Customer Lifetime Value
  - Churn Risk
  - Conversion Rate
